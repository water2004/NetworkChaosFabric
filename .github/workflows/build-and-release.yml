name: Build and release

on:
  push:
    branches:
      - main
      - 1.21.1
    tags:
      - '[0-9]*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Microsoft OpenJDK 21
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify tag and project versions match
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          project_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$GITHUB_REF_NAME" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $project_version" >&2
            exit 1
          fi

      - name: Build and test
        run: ./gradlew clean build --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: network-chaos-fabric-${{ github.ref_name }}
          path: build/libs/network-chaos-fabric-*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: network-chaos-fabric-${{ github.ref_name }}
          path: release-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          notes_file=".github/release-notes/${tag}.md"
          prerelease_args=()
          if [[ "$tag" == *-alpha.* || "$tag" == *-beta.* || "$tag" == *-rc.* ]]; then
            prerelease_args+=(--prerelease)
          fi
          if [[ -f "$notes_file" ]]; then
            notes_args=(--notes-file "$notes_file")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$tag" \
            release-artifacts/network-chaos-fabric-*.jar \
            --title "Network Chaos Fabric $tag" \
            "${prerelease_args[@]}" \
            "${notes_args[@]}"
